name: mazhar
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  cupertino_icons: ^1.0.8
  printing: ^5.13.1
  pdf: ^3.11.3
  path_provider: ^2.0.10
  flutter_launcher_icons: ^0.13.1
  intl: ^0.18.1
  table_calendar: ^3.0.9
  fl_chart: ^0.64.0


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png" # Replace with your icon path
  min_sdk_android: 21

  intl: ^0.18.1  # Or the latest version
  shimmer: ^2.0.0  # Add this line


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png  # This should be under the flutter section
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/images/back.jpg
